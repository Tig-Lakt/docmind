<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый пароль — DocMind</title>
  <link rel="stylesheet" href="/frontend/css/main.css">
</head>
<body>
  <div class="auth-wrap">

    <div class="auth-side">
      <div class="auth-side-logo">Doc<span>.</span>Mind</div>
      <div class="auth-side-heading">Новый пароль</div>
      <p class="auth-side-sub">
        Придумайте надёжный пароль — не менее 8 символов,
        обязательно буквы и цифры.
      </p>
    </div>

    <div class="auth-form-wrap">
      <div class="auth-form-box">
        <h2>Придумайте новый пароль</h2>
        <p>Вспомнили пароль? <a href="/api/v1/auth/login">Войти</a></p>

        <div id="alert" class="alert"></div>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="password">Новый пароль</label>
            <input type="password" id="password" placeholder="Минимум 8 символов и цифра" required>
          </div>
          <div class="field">
            <label for="password-confirm">Повторите пароль</label>
            <input type="password" id="password-confirm" placeholder="Повторите пароль" required>
          </div>
          <button class="btn" id="submit-btn" type="submit">Сохранить пароль</button>
        </form>
      </div>
    </div>

  </div>
  <script src="/frontend/js/recovery.js"></script>
</body>
</html>
