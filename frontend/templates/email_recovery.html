<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля — DocMind</title>
  <link rel="stylesheet" href="/frontend/css/main.css">
</head>
<body>
  <div class="auth-wrap">

    <div class="auth-side">
      <div class="auth-side-logo">Doc<span>.</span>Mind</div>
      <div class="auth-side-heading">Забыли пароль?</div>
      <p class="auth-side-sub">
        Введите email указанный при регистрации — мы отправим ссылку для сброса пароля.
        Ссылка действительна 1 час.
      </p>
    </div>

    <div class="auth-form-wrap">
      <div class="auth-form-box">
        <h2>Сброс пароля</h2>
        <p>Вспомнили пароль? <a href="/api/v1/auth/login">Войти</a></p>

        <div id="alert" class="alert"></div>

        <form id="recovery-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
          </div>
          <button class="btn" id="submit-btn" type="submit">Отправить ссылку</button>
        </form>
      </div>
    </div>

  </div>
  <script src="/frontend/js/recovery.js"></script>
</body>
</html>
