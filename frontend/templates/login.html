<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — DocMind</title>
  <link rel="stylesheet" href="/frontend/css/main.css">
</head>
<body>
  <div class="auth-wrap">

    <div class="auth-side">
      <div class="auth-side-logo">Doc<span>.</span>Mind</div>
      <div class="auth-side-heading">С возвращением.</div>
      <p class="auth-side-sub">
        Войдите, чтобы продолжить работу со своими документами
        и получать точные ответы от агента.
      </p>
    </div>

    <div class="auth-form-wrap">
      <div class="auth-form-box">
        <h2>Войти</h2>
        <p>Нет аккаунта? <a href="/api/v1/auth/register">Зарегистрироваться</a></p>

        <div id="alert" class="alert"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Ваш пароль" required>
          </div>
          <button class="btn" id="submit-btn" type="submit">Войти</button>
        </form>
        <p>Забыли пароль? <a href="/api/v1/recovery/forgot-password">Восстановить</a></p>
      </div>
    </div>

  </div>
  <script src="/frontend/js/auth.js"></script>
</body>
</html>
